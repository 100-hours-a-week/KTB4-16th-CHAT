spring:
  application:
    name: mulo-chat
  datasource:
    url: ${CHAT_DB_URL}
    username: ${CHAT_DB_USERNAME}
    password: ${CHAT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

chat:
  websocket:
    allowed-origins: ${CHAT_WS_ALLOWED_ORIGINS:}
  auth:
    backend:
      url: ${CHAT_BACKEND_URL:}
      internal-api-key: ${CHAT_INTERNAL_API_KEY:}
      connect-timeout: ${CHAT_AUTH_CONNECT_TIMEOUT:2s}
      response-timeout: ${CHAT_AUTH_RESPONSE_TIMEOUT:3s}
  moderation:
    ai:
      base-url: ${CHAT_MODERATION_AI_BASE_URL:}
      internal-token: ${AI_INTERNAL_TOKEN:}
      connect-timeout: ${CHAT_MODERATION_AI_CONNECT_TIMEOUT:1s}
      response-timeout: ${CHAT_MODERATION_AI_RESPONSE_TIMEOUT:5s}
  diagnostics:
    stomp-send:
      enabled: ${CHAT_STOMP_SEND_DIAGNOSTICS_ENABLED:false}
      deployment-environment: ${CHAT_DEPLOYMENT_ENVIRONMENT:}

server:
  port: 8081
  tomcat:
    mbeanregistry:
      enabled: true

# 상태 확인과 Prometheus 지표 엔드포인트를 HTTP로 노출한다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false
  max-request-body-size: none

# 로컬 구형 전송은 기본값이며 ECS는 enabled=true를 필수로 검증한다.
chat.delivery:
  enabled: ${CHAT_DELIVERY_ENABLED:false}
  redis:
    host: ${CHAT_REDIS_HOST:127.0.0.1}
    port: ${CHAT_REDIS_PORT:6379}
    tls: ${CHAT_REDIS_TLS:false}
    username: ${CHAT_REDIS_USERNAME:}
    password: ${CHAT_REDIS_PASSWORD:}
    environment: ${CHAT_DELIVERY_ENVIRONMENT:local}
    connect-timeout: 1s
    command-timeout: 500ms
