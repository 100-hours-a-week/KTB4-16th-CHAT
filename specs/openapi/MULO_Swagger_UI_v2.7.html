    "/api/records": {
      "post": {
        "tags": [
          "RECORD / 자물쇠"
        ],
        "summary": "자물쇠 생성",
        "operationId": "postApiRecords",
        "description": "필수\nlocation.latitude: Double\nlocation.longitude: Double\nmusic.externalTrackId: String\nmoodScore: Integer (-50 이상 50 이하)\nuploadId: Long\n\n선택\nlocation.legalDongCode: String | null\nlocation.legalDongName: String | null\ncomment: String (최대 80자)\n\n서버 자동 처리\nplaceId: Long\nmusicTrackId: Long\nweatherCondition: String | null\ntemperature: Number | null\n\n정책\n- 프론트는 브라우저 Geolocation API로 최초 위치를 얻고 Kakao Maps SDK 지도에서 사용자가 수정한 최종 latitude/longitude를 확정한다.\n- latitude는 -90 이상 90 이하, longitude는 -180 이상 180 이하이다. 이는 좌표 유효성 검증이며 국내 여부 판별이 아니다.\n- latitude와 longitude가 모두 정확히 동일한 기존 Place를 먼저 조회한다. 기존 Place는 법정동 재검증·갱신 및 Kakao 재호출 없이 그대로 재사용한다. 근접 좌표는 재사용하지 않는다.\n- 동일 좌표 Place가 없으면 백엔드가 최종 latitude/longitude로 Kakao coord2regioncode API를 호출한다.\n- region_type=B이며 code와 region_3depth_name이 모두 null/blank가 아닌 법정동을 확인한 경우에만 해당 서버 응답값으로 신규 Place를 생성한다.\n- 법정동(B)을 확인할 수 없는 해외·해상 등 위치에서는 신규 Place와 Record를 생성하지 않고 400 UNSUPPORTED_RECORD_LOCATION을 반환한다.\n- Kakao API 통신 실패·HTTP 오류·비정상 응답은 502 LOCATION_SERVICE_ERROR로 구분한다.\n- 요청의 legalDongCode/legalDongName은 기존 FE 호환성을 위한 선택 입력이다. 두 값은 함께 값이 있거나 함께 null이어야 하지만 신규 Place 생성의 신뢰값으로 사용하지 않는다.\n- 기존 데이터의 UNKNOWN / 위치 정보 없음 조회 fallback은 유지하며, 신규 Place에 UNKNOWN이나 미확인 법정동을 저장하지 않는다.\n- 대시보드는 places.legal_dong_code를 기준으로 그룹화한다. legal_dong_code가 null인 데이터는 하나의 미확인 그룹으로 집계하고 UI에서 \"확인할 수 없음\"으로 표시한다.\n- legalDongName은 nullable이며 DB의 places.legal_dong_name을 그대로 반환한다. \"확인할 수 없음\" 문자열은 DB/API 값으로 저장하지 않는다.\n- 요청으로 전달된 음악 메타데이터를 사용하며, 기존 externalTrackId는 재사용하고 신규 externalTrackId는 요청값으로 music_tracks에 저장한다. 자물쇠 생성 과정에서는 Spotify API를 재호출하지 않는다.\n- 날씨/기온은 백엔드에서 자동 조회하며 클라이언트가 전달하지 않는다.\n- 위·경도를 기상청 격자(nx, ny)로 변환한 뒤 동일 KST 날짜·격자의 weather_grid_forecasts 캐시를 우선 조회하고, 당일 캐시가 없으면 기상청 단기예보 getVilageFcst를 조회·저장한다.\n- 요청 시각의 분이 00~29이면 현재 정각, 30~59이면 다음 정각의 forecast_at을 사용한다. 예: 15:10 → 15:00, 15:50 → 16:00.\n- weatherCondition은 CLEAR, CLOUDY, OVERCAST, RAIN, SNOW, RAIN_SNOW, SHOWER 중 하나만 사용한다.\n- 최초 적재는 목표 예보시각을 포함하는 가장 최근 후보 회차를 시도하고, 실패·미포함이면 바로 이전 후보 회차를 한 번만 시도한다. 모두 실패해 날씨/기온을 확보하지 못한 경우에도 기록 생성 실패로 처리하지 않고 null로 저장한다.\n- 사진은 필수이며 현재 사용자가 소유한 유효한 uploadId를 반드시 전달해야 한다.\n- 자물쇠 생성 완료 시 사진은 정확히 1장 연결된다.\n- uploadId는 생성 후 1시간 이내의 유효한 임시 업로드여야 한다.\n- 자물쇠 생성이 성공하면 record_photos에 최종 사진 정보를 저장하고 해당 uploads 레코드는 삭제한다.",
