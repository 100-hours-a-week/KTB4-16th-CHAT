name: Chat CI prod

# main 브랜치 전용 CI. PR 검증, push 시 프로덕션 이미지 릴리즈까지만 한다.
# 프로덕션 배포는 cd-prod.yml이 이 워크플로가 성공하면 이어서 한다.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "**.md"
  pull_request:
    branches:
      - main

jobs:
  pr-ci:
    if: github.event_name == 'pull_request'
    name: Chat CI prod pull_request
    runs-on: ubuntu-latest
    concurrency:
      group: pr-ci-${{ github.ref }}
      cancel-in-progress: true
    # 테스트가 실제 MySQL(Flyway 마이그레이션 포함)을 쓴다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mulo_chat
          MYSQL_USER: mulo_chat
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      # 컴파일 (테스트 코드 포함)
      - name: Run Compile
        run: ./gradlew compileJava compileTestJava

      - name: Run Tests
        env:
          CHAT_DB_URL: jdbc:mysql://127.0.0.1:3308/mulo_chat?serverTimezone=Asia/Seoul&characterEncoding=utf8&useUnicode=true
          CHAT_DB_USERNAME: mulo_chat
          CHAT_DB_PASSWORD: ci-test-password
          CHAT_BACKEND_URL: http://localhost:8080
          CHAT_INTERNAL_API_KEY: ci-test-internal-key
          CHAT_WS_ALLOWED_ORIGINS: http://localhost:5173
          # 앱 JVM은 운영과 같은 Asia/Seoul로 돌린다. 러너 기본 시간대(UTC)면 시간 기준 테스트가 실패한다.
          JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
        run: ./gradlew test

      # 리포트는 실패했을 때 확인할 수 있도록 올린다
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Notify result
        if: ${{ always() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Chat CI prod pull_request"
          status: ${{ job.status }}

  main-ci:
    if: github.event_name == 'push'
    name: Chat CI prod release
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mulo_chat
          MYSQL_USER: mulo_chat
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    concurrency:
      group: chat-main-release
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    env:
      IMAGE_BASE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROJECT_REPOSITORY }}/${{ secrets.IMAGE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # semantic-release가 Git 태그 및 히스토리를 분석해야 하므로 0 유지 필수
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Tests
        env:
          CHAT_DB_URL: jdbc:mysql://127.0.0.1:3308/mulo_chat?serverTimezone=Asia/Seoul&characterEncoding=utf8&useUnicode=true
          CHAT_DB_USERNAME: mulo_chat
          CHAT_DB_PASSWORD: ci-test-password
          CHAT_BACKEND_URL: http://localhost:8080
          CHAT_INTERNAL_API_KEY: ci-test-internal-key
          CHAT_WS_ALLOWED_ORIGINS: http://localhost:5173
          JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
        run: ./gradlew test

      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      # 테스트는 위에서 이미 실행했으므로 jar는 테스트를 건너뛰고 만든다
      - name: Build jar
        run: ./gradlew bootJar -x test

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      # release.config.main.json을 .releaserc.json으로 복사해서 쓴다.
      # `semantic-release --extends <path>`로 넘기면 플러그인 모듈 해석 경로가 달라져 기본 플러그인을 못 찾는다.
      - name: Release chat image
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: |
          cp release.config.main.json .releaserc.json
          npx --yes \
            --package=semantic-release@25 \
            --package=@semantic-release/exec@7 \
            semantic-release

      - name: Notify result
        if: ${{ always() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Chat CI prod release"
          status: ${{ job.status }}
