name: Chat CI dev

# develop 브랜치 PR 검증만 한다.
# 개발 환경(GCP 개발 VM)이 없어져서 개발 이미지 릴리즈와 개발 배포(cd-dev)는 없앴다. (2026-11-23)
on:
  pull_request:
    branches:
      - develop

jobs:
  pr-ci:
    if: github.event_name == 'pull_request'
    name: Chat CI dev pull_request
    runs-on: ubuntu-latest
    concurrency:
      group: pr-ci-${{ github.ref }}
      cancel-in-progress: true
    # 테스트가 실제 MySQL(Flyway 마이그레이션 포함)을 쓴다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mulo_chat
          MYSQL_USER: mulo_chat
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      # 컴파일 (테스트 코드 포함)
      - name: Run Compile
        run: ./gradlew compileJava compileTestJava

      - name: Run Tests
        env:
          CHAT_DB_URL: jdbc:mysql://127.0.0.1:3308/mulo_chat?serverTimezone=Asia/Seoul&characterEncoding=utf8&useUnicode=true
          CHAT_DB_USERNAME: mulo_chat
          CHAT_DB_PASSWORD: ci-test-password
          CHAT_BACKEND_URL: http://localhost:8080
          CHAT_INTERNAL_API_KEY: ci-test-internal-key
          CHAT_WS_ALLOWED_ORIGINS: http://localhost:5173
          # 앱 JVM은 운영과 같은 Asia/Seoul로 돌린다. 러너 기본 시간대(UTC)면 시간 기준 테스트가 실패한다.
          JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
        run: ./gradlew test

      # 리포트는 실패했을 때 확인할 수 있도록 올린다
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Notify result
        if: ${{ always() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Chat CI dev pull_request"
          status: ${{ job.status }}
